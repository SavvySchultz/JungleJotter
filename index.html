<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 Jungle Jotter</title>

    <link .css
</head>
<body>

    <header class="header">
        <h1>🌴 Jungle Jotter</h1>
        <p>Your IT Survival Guide Through the Jungle</p>
    </header>

    <div class="container">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search MFA, VPN, Printers, Shared Mailboxes..."
            >
        </div>

        <div id="results"></div>

        <div class="form-card">

            <h2>📝 Add New Discovery</h2>

            <input
                type="text"
                id="title"
                placeholder="Task Name"
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
            >

            <textarea
                id="steps"
                rows="6"
                placeholder="Enter one step per line..."
            ></textarea>

            <button onclick="addArticle()">
                Save Discovery
            </button>

        </div>

    </div>

    <footer>
        🌴 Jungle Jotter • Built for IT Explorers
    </footer>

    app.js

</body>
</html>
