<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jungle Jotter</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>🌴 Jungle Jotter</h1>
    <p>IT Knowledge Discovery Portal</p>
</header>

<nav>
    <a href="index.html">Add Discovery</a>
    knowledge.html
    ">Dashboard</a>
</nav>

<div class="container">

    <div class="card">

        <h2>Add New Discovery</h2>

        <input
            id="title"
            type="text"
            placeholder="Issue Title">

        <select id="category">

            <option value="Microsoft 365">Microsoft 365</option>
            <option value="Outlook">Outlook</option>
            <option value="Teams">Microsoft Teams</option>
            <option value="OneDrive">OneDrive</option>
            <option value="SharePoint">SharePoint</option>
            <option value="Active Directory">Active Directory</option>
            <option value="Azure">Azure</option>
            <option value="VPN">VPN</option>
            <option value="Printer">Printer</option>
            <option value="Network">Network</option>
            <option value="Security">Security</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Other">Other</option>

        </select>

        <input
            id="tags"
            type="text"
            placeholder="Tags (vpn,password,mfa,outlook)">

        <textarea
            id="notes"
            rows="12"
            placeholder="Paste technician notes here..."></textarea>

        <h3>Attachments</h3>

        <input
            type="file"
            id="files"
            multiple
            accept=".pdf,.doc,.docx,.txt,.xlsx,.one,.png,.jpg,.jpeg">

        <div class="button-row">

            <button onclick="cleanNotes()">
                🤖 AI Clean Notes
            </button>

            <button onclick="saveDiscovery()">
                🌿 Save Discovery
            </button>

        </div>

        <div id="aiOutput"></div>

    </div>

</div>

app.js

</body>
</html>
