<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Jotter</title>
    ">
</head>
<body>

<header>
    <h1>🌿 Jungle Jotter</h1>
    <p>Your IT Knowledge Jungle</p>
</header>

<div class="container">

    <section class="search-section">
        <input
            type="text"
            id="searchBox"
            placeholder="Search Outlook, VPN, Printer, MFA..."
        >
    </section>

    <section class="note-form">
        <h2>Add Knowledge Entry</h2>

        <input
            type="text"
            id="title"
            placeholder="Task Title"
        >

        <select id="category">
            <option>General</option>
            <option>Outlook</option>
            <option>VPN</option>
            <option>Printer</option>
            <option>Active Directory</option>
            <option>M365</option>
            <option>Network</option>
        </select>

        <textarea
            id="notes"
            placeholder="Enter troubleshooting steps, fixes, procedures..."
        ></textarea>

        <button onclick="saveNote()">Add Note</button>
    </section>

    <section>
        <h2>Knowledge Base</h2>
        <div id="notesContainer"></div>
    </section>

</div>

<footer>
    Jungle Jotter © 2026
</footer>

app.js

</body>
</html>
