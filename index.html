<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Jotter</title>

    style.css
</head>

<body>

    <header>
        <div class="logo-section">
            <h1>🌴 Jungle Jotter</h1>
            <p>Your IT Survival Guide Through the Jungle</p>
        </div>
    </header>

    <main>

        <section class="hero">

            <div class="hero-card">

                <h2>🧭 Find a Survival Guide</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search MFA, VPN, Printers, Shared Mailboxes..."
                >

            </div>

        </section>

        <section id="results" class="results"></section>

        <section class="add-section">

            <h2>📝 Add New Discovery</h2>

            <input
                type="text"
                id="title"
                placeholder="Task Name"
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
            >

            <textarea
                id="steps"
                rows="8"
                placeholder="Enter one step per line..."
            ></textarea>

            <button onclick="addArticle()">
                🌿 Save Discovery
            </button>

        </section>

    </main>

    <footer>
        🌴 Jungle Jotter • Built for IT Explorers
    </footer>

    app.js

</body>

</html>
