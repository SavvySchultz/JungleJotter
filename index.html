<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Jotter</title>

    style.css
</head>
<body>

<header>
    <h1>🌴 Jungle Jotter</h1>
    <p>Your IT Survival Guide Through the Jungle</p>
</header>

<main class="container">

    <section class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search the Jungle..."
        >
    </section>

    <section id="results"></section>

    <section class="add-section">
        <h2>📝 Add New Discovery</h2>

        <input
            type="text"
            id="title"
            placeholder="Task Name"
        >

        <input
            type="text"
            id="category"
            placeholder="Category (M365, Networking, Printers, etc.)"
        >

        <textarea
            id="steps"
            rows="8"
            placeholder="Enter each step on a new line..."
        ></textarea>

        <button onclick="addArticle()">
            🌿 Save Discovery
        </button>
    </section>

</main>

<footer>
    Jungle Jotter • IT Knowledge Base
</footer>

app.js

</body>
</html>
