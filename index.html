<!DOCTYPE html>
<html>
<head>
    <title>Jungle Jotter - Submit Discovery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🌴 Jungle Jotter</h1>
    <p>Submit New Discovery</p>
</header>

<nav>
    <a href="index.html">Add Discovery</a>
    knowledge.html
</nav>

<div class="container">

    <div class="card">

        <h2>Add New Discovery</h2>

        <input
            id="title"
            placeholder="Issue / Task Name">

        <select id="category">

            <option value="Outlook">Outlook</option>
            <option value="VPN">VPN</option>
            <option value="M365">Microsoft 365</option>
            <option value="Printer">Printer</option>
            <option value="Email">Email</option>
            <option value="Network">Network</option>
            <option value="Active Directory">Active Directory</option>
            <option value="Security">Security</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Other">Other</option>

        </select>

        <input
            id="tags"
            placeholder="Tags (vpn, password, remote)">

        <textarea
            id="notes"
            rows="10"
            placeholder="Paste messy notes here..."></textarea>

        <input
            type="file"
            id="attachment"
            accept=".pdf,.doc,.docx,.one,.txt,.png,.jpg,.jpeg">

        <button onclick="cleanNotes()">
            🌿 Clean Notes
        </button>

        <div id="cleanedArea"></div>

        <button onclick="saveDiscovery()">
            Save Discovery
        </button>

    </div>

</div>

app.js

</body>
</html>
