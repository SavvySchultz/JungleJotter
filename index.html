<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Jungle Jotter Pro</title>

    <link
        rel="stylesheet"
        href="styles.css">

</head>

<body>

    <header>

        <h1>🌴 Jungle Jotter Pro</h1>

        <p>
            IT Knowledge Management System
        </p>

    </header>

    <nav>

        <a href="index.html">
            Add Discovery
        </a>

        <a href="knowledge.html">
            Knowledge Base
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

    </nav>

    <div class="container">

        <div class="card">

            <h2>
                New Discovery
            </h2>

            <input
                id="title"
                placeholder="Issue Title">

            <select id="category">

                <option>Microsoft 365</option>
                <option>Outlook</option>
                <option>Teams</option>
                <option>OneDrive</option>
                <option>SharePoint</option>
                <option>Active Directory</option>
                <option>VPN</option>
                <option>Network</option>
                <option>Security</option>
                <option>Printer</option>
                <option>Hardware</option>
                <option>Software</option>
                <option>Other</option>

            </select>

            <input
                id="tags"
                placeholder="Tags">

            <textarea
                id="notes"
                rows="12"
                placeholder="Paste ticket notes here"></textarea>

            <div class="button-row">

                <button onclick="smartClean()">
                    🤖 Smart AI Clean
                </button>

                <button onclick="undoSmartClean()">
                    ↩ Undo
                </button>

                <button onclick="saveDiscovery()">
                    🌿 Save Discovery
                </button>

            </div>

        </div>

    </div>

    app.js"></script>

</body>

</html>
