<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Jotter</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>🌴 Jungle Jotter</h1>
    <p>IT Knowledge Discovery Portal</p>
</header>

<nav>
    <a href="index.html">Add Discovery</a>
    knowledge.html
    dashboard.html
</nav>

<div class="container">

<div class="card">

<h2>Add New Discovery</h2>

<input id="title" placeholder="Issue Title">

<select id="category">

<option>Microsoft 365</option>
<option>Outlook</option>
<option>Teams</option>
<option>VPN</option>
<option>Network</option>
<option>Printer</option>
<option>Active Directory</option>
<option>Security</option>
<option>Hardware</option>
<option>Software</option>
<option>Other</option>

</select>

<input id="tags" placeholder="Tags">

<textarea
id="notes"
rows="10"
placeholder="Paste technician notes here">
</textarea>

<h3>Attachments</h3>

<input
type="file"
id="files"
multiple
accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">

<div class="buttons">

<button onclick="cleanNotes()">
🤖 AI Clean Notes
</button>

<button onclick="saveDiscovery()">
🌿 Save Discovery
</button>

</div>

<div id="aiOutput"></div>

</div>

</div>

app.jsscript>

</body>
</html>
