<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

">

</head>

<body>

<header>

<h1>📊 Dashboard</h1>

<p>Knowledge Base Analytics</p>

</header>

<nav>

<a href="index.html">
🌿 New Discovery
</a>

<a href="knowledge.html">
📚 Knowledge Base
</a>

<a href="dashboard.html">
📊 Dashboard
</a>

</nav>

<div class="container">

<div class="dashboard-grid">

<div class="stat-card">

<h2 id="totalDiscoveries">
0
</h2>

<p>Total Discoveries</p>

</div>

<div class="stat-card">

<h2 id="favoriteCount">
0
</h2>

<p>Favorite Tickets</p>

</div>

<div class="stat-card">

<h2 id="topCategory">
None
</h2>

<p>Top Category</p>

</div>

<div class="stat-card">

<h2 id="topTicket">
None
</h2>

<p>Most Helpful Ticket</p>

</div>

</div>

<div class="card">

<h2>Recent Discoveries</h2>

<div id="recentTickets">

</div>

</div>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
loadDashboard
);

function loadDashboard(){

const discoveries =
JSON.parse(
localStorage.getItem(
"discoveries"
)
) || [];

document.getElementById(
"totalDiscoveries"
).textContent =
discoveries.length;

const favorites =
discoveries.filter(
x => x.favorite
);

document.getElementById(
"favoriteCount"
).textContent =
favorites.length;

const categories =
{};

discoveries.forEach(item=>{

if(!categories[item.category]){

categories[item.category] = 0;

}

categories[item.category]++;

});

let highestCount = 0;
let topCategory = "None";

for(
const category
in categories
){

if(
categories[category]
>
highestCount
){

highestCount =
categories[category];

topCategory =
category;

}

}

document.getElementById(
"topCategory"
).textContent =
topCategory;

let topTicket = "None";

if(discoveries.length){

const best =
discoveries.reduce(
(a,b)=>
a.rating > b.rating
? a
: b
);

topTicket =
best.title;
}

document.getElementById(
"topTicket"
).textContent =
topTicket;

const recent =
document.getElementById(
"recentTickets"
);

recent.innerHTML = "";

discoveries
.slice()
.reverse()
.slice(0,5)
.forEach(item=>{

recent.innerHTML +=
`
<div class="discovery">

<h3>${item.title}</h3>

<p>${item.category}</p>

</div>
`;
});

}

</script>

</body>

</html>
