<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ticket Details</title>

<link
rel="stylesheet"
href="styles.css">

</head>

<body>

<header>

<h1 id="ticketTitle">
Ticket Details
</h1>

<p>
Discovery Details
</p>

</header>

<nav>

<a href="index.html">
🌿 New Discovery
</a>

<a href="knowledge.html">
📚 Knowledge Base
</a>

<a href="dashboard.html">
📊 Dashboard
</a>

</nav>

<div class="container">

<div class="card">

<div id="ticketDetails">

</div>

<br>

<button
onclick="copyNotes()">
📋 Copy Notes
</button>

<button
onclick="window.location.href='knowledge.html'">
⬅ Back
</button>

</div>

</div>

<script>

let ticket = null;

document.addEventListener(
"DOMContentLoaded",
()=>{

ticket =
JSON.parse(
localStorage.getItem(
"selectedTicket"
)
);

if(!ticket){

document.getElementById(
"ticketDetails"
).innerHTML =

"<h2>No Ticket Found</h2>";

return;
}

document.getElementById(
"ticketTitle"
).innerText =
ticket.title;

document.getElementById(
"ticketDetails"
).innerHTML =

`
<h2>
${ticket.title}
</h2>

<hr>

<p>
<strong>Category:</strong>
${ticket.category}
</p>

<p>
<strong>Tags:</strong>
${ticket.tags}
</p>

<p>
<strong>Created:</strong>
${ticket.created}
</p>

<p>
<strong>Helpful Votes:</strong>
${ticket.rating}
</p>

<hr>

<h3>
Resolution Notes
</h3>

<pre>
${ticket.notes}
</pre>
`;

});

function copyNotes(){

if(!ticket) return;

navigator.clipboard
.writeText(
ticket.notes
);

alert(
"Notes copied."
);

}

</script>

</body>
</html>
