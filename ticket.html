<div class="container">

<div class="card">

<h2 id="ticketTitle">
Loading...
</h2>

<div id="ticketContent">

</div>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
()=>{

const ticket =
JSON.parse(
localStorage.getItem(
"selectedTicket"
)
);

if(!ticket){

document.getElementById(
"ticketContent"
).innerHTML =

"<h3>No Ticket Found</h3>";

return;
}

document.getElementById(
"ticketTitle"
).innerText =
ticket.title;

document.getElementById(
"ticketContent"
).innerHTML =

`
<p>
<strong>Category:</strong>
${ticket.category}
</p>

<p>
<strong>Tags:</strong>
${ticket.tags}
</p>

<p>
<strong>Created:</strong>
${ticket.created}
</p>

<p>
<strong>Helpful Votes:</strong>
${ticket.rating}
</p>

<hr>

<pre>
${ticket.notes}
</pre>

<button onclick="history.back()">
⬅ Back
</button>
`;

});

</script>

</body>
